name: gmmx_member_app
description: "GMMX Member App — Your personal fitness companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # ── State Management & Routing ──
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0

  # ── Backend ──
  appwrite: ^25.3.0

  # ── UI & Design ──
  google_fonts: ^8.1.0
  lucide_icons: ^0.257.0
  lottie: ^3.3.3
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  animate_do: ^3.3.4
  cached_network_image: ^3.4.1
  fl_chart: ^0.70.2

  # ── Storage ──
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5

  # ── Location & Permissions ──
  geolocator: ^13.0.2
  permission_handler: ^11.4.0

  # ── QR & Camera ──
  mobile_scanner: ^6.0.10

  # ── Connectivity ──
  connectivity_plus: ^6.1.4
  network_info_plus: ^6.1.1

  # ── Utilities ──
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  collection: ^1.19.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
