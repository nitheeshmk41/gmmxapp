name: Test VPS Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "SSH connection successful!"
            echo "User: $(whoami)"
            echo "Host: $(hostname)"
            echo "Node: $(node -v)"
            echo "npm: $(npm -v)"
            echo "PM2: $(pm2 -v)"
